<!DOCTYPE html>
<html lang="sk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Zamestnanec</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">

    <h2 class="mb-3"
        th:text="${employee.id != null} ? 'Upraviť zamestnanca' : 'Pridať zamestnanca'"></h2>

    <form th:object="${employee}"
          th:action="${employee.id != null} ? @{/employees/{id}(id=${employee.id})} : @{/employees}"
          method="post">
        <div class="card">
            <div class="card-body">

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="firstName" class="form-label">Meno</label>
                        <input type="text" class="form-control" id="firstName" th:field="*{firstName}"
                               maxlength="255" required>
                    </div>
                    <div class="col-md-6">
                        <label for="lastName" class="form-label">Priezvisko</label>
                        <input type="text" class="form-control" id="lastName" th:field="*{lastName}"
                               maxlength="255" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="birthDate" class="form-label">Dátum narodenia</label>
                        <input type="date" class="form-control" id="birthDate" th:field="*{birthDate}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" th:field="*{email}"
                               maxlength="255" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="phone" class="form-label">Telefón</label>
                        <input type="tel" class="form-control" id="phone" th:field="*{phone}"
                               maxlength="15" required>
                    </div>
                    <div class="col-md-6">
                        <label for="salary" class="form-label">Plat (€)</label>
                        <input type="number" step="1" min="0" class="form-control" id="salary"
                               th:field="*{salary}">
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="jobTitle" class="form-label">Pozícia</label>
                        <select class="form-select" id="jobTitle" th:field="*{jobTitle}" required>
                            <option value="" disabled hidden th:selected="${employee.jobTitle == null}">
                                Vyberte pozíciu
                            </option>
                            <option th:each="title : ${jobTitles}" th:value="${title}" th:text="${title}"></option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label d-block">Úväzok</label>
                        <div class="form-check form-check-inline" th:each="type, st : ${employmentTypes}">
                            <input class="form-check-input" type="radio" th:field="*{fullTime}"
                                   th:value="${st.index}" required>
                            <label class="form-check-label" th:for="${#ids.prev('fullTime')}"
                                   th:text="${type}"></label>
                        </div>
                    </div>
                </div>

            </div>
            <div class="card-footer">
                <a th:href="@{/employees}" class="btn btn-secondary">Späť na zoznam</a>
                <button type="submit" class="btn btn-primary"
                        th:text="${employee.id != null} ? 'Uložiť zmeny' : 'Pridať'"></button>
            </div>
        </div>
    </form>

</div>
</body>
</html>
